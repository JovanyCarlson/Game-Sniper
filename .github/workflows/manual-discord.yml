name: GameSniper - send selected game to Discord
on:
  workflow_dispatch:
    inputs:
      selector:
        description: 'Private opaque selection proof; no game IDs or names'
        required: true
        type: string
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send requested game via private webhook
        env:
          GAME_SELECTOR: ${{ inputs.selector }}
          GAMESNIPER_STATE_KEY: ${{ secrets.GAMESNIPER_STATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m sniper.manual_send
