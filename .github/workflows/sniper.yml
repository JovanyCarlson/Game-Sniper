name: GameSniper - encrypted 24/7 radar
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: write
concurrency:
  group: gamesniper-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan, alert privately, encrypt entire state
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GAMESNIPER_STATE_KEY: ${{ secrets.GAMESNIPER_STATE_KEY }}
          GAMESNIPER_PRIVATE_WATCHLIST_JSON: ${{ secrets.GAMESNIPER_PRIVATE_WATCHLIST_JSON }}
        run: python -m sniper.engine
      - name: Commit encrypted state only
        run: |
          git config user.name 'GameSniper Bot'
          git config user.email 'gamesniper-bot@users.noreply.github.com'
          git add docs/secure.enc.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: encrypted snapshot [skip ci]'
            git push
          fi
      - name: Upload only ciphertext + password-gated dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: scan
    if: success()
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
