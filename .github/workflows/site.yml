name: GameSniper - public lock page (no secrets)
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/app.js'
      - 'docs/style.css'
      - 'docs/extra.css'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: pages
        uses: actions/deploy-pages@v4
